<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindBed Carmesí</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#800020">
</head>
<body>

  <!-- Encabezado con imagen de título -->
  <header class="hero-header">
    <div class="top-nav">
      <button class="icon-btn">🔒</button>
    </div>
    <img src="Encabezado.jpg" alt="FindBed Carmesí" class="img-encabezado">
    <p class="subtitulo">Reserva inmediata en Hoteles, Moteles y Resorts</p>
  </header>

  <!-- Portada Principal -->
  <div class="seccion-portada">
    <img src="portada.jpg" alt="FindBed Carmesí Hotel" class="img-portada">
  </div>

  <!-- Contenedor Principal de Búsqueda -->
  <main class="contenedor-principal">
    
    <h2>Categorías</h2>
    <div class="grid-filtros">
      <button class="glass-card active" onclick="seleccionarFiltro(this, 'Hoteles')">Hoteles</button>
      <button class="glass-card" onclick="seleccionarFiltro(this, 'Resorts')">Resorts</button>
      <button class="glass-card" onclick="seleccionarFiltro(this, 'Moteles')">Moteles</button>
    </div>

    <h2>Ubicación</h2>
    <div class="grid-ubicacion">
      <div class="campo-grupo">
        <label>Estado</label>
        <select id="select-estado" class="glass-select" onchange="cargarCiudades()">
          <option value="Caracas (DC)">Caracas (DC)</option>
          <option value="Carabobo">Carabobo</option>
          <option value="Cojedes">Cojedes</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label>Ciudad</label>
        <select id="select-ciudad" class="glass-select" onchange="cargarZonas()">
          <option value="Chacao">Chacao</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label>Zona</label>
        <select id="select-zona" class="glass-select">
          <option value="Altamira">Altamira</option>
        </select>
      </div>
    </div>

    <button class="btn-buscar" onclick="buscarDisponibilidad()">Buscar Disponibilidad 🔍</button>

    <!-- Panel Publicitario -->
    <div class="panel-anuncios">
      <p>📢 Publicidad Destacada</p>
      <img src="Anuncio-PinkWhather.jpg" alt="Anuncio Pink Weather" style="width: 100%; border-radius: 12px; margin-top: 10px;">
    </div>

  </main>

  <script src="hoteles.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrado', reg))
        .catch(err => console.warn('Error en Service Worker', err));
    }
  </script>
</body>
      </html>
